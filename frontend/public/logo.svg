<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Das Zeichen: weisse Kachel, wenn das System hell ist, dunkle, wenn es dunkel ist (Quelle nexapps/icons-vergleich/neu.py). -->
  <style>
    .grund { fill: #fff }
    .rand { stroke: #65a30d; stroke-opacity: .35 }
    .zeiger { stroke: #4d8f0a }
    .nabe { fill: #4d8f0a; stroke: #fff }
    .v1 { stop-color: #bef264 } .v2 { stop-color: #65a30d } .v3 { stop-color: #365314 }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #0d110a }
      .rand { stroke: #a3e635; stroke-opacity: .45 }
      .zeiger { stroke: #bef264 }
      .nabe { fill: #bef264; stroke: #0d110a }
      .v1 { stop-color: #ecfccb } .v2 { stop-color: #a3e635 } .v3 { stop-color: #65a30d }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/>
      <stop offset=".5" class="v2"/>
      <stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <g transform="translate(0 -3)">
    <path d="M14.4 47.5A19 19 0 1 1 49.6 47.5" fill="none" stroke="url(#g)" stroke-opacity=".3" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M14.4 47.5A19 19 0 0 1 45.4 26.6" fill="none" stroke="url(#g)" stroke-width="4.6" stroke-linecap="round"/>
    <path class="zeiger" d="M32 40 42 28.5" stroke-width="3.8" stroke-linecap="round"/>
    <circle class="nabe" cx="32" cy="40" r="4.6" stroke-width="2"/>
  </g>
</svg>
